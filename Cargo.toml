[workspace]
resolver = "3"
members = [
    "crates/*",
    "tools/*",
]

[workspace.package]
edition = "2024"
# The base MSRV; crates needing more set their own (`nur msrv` checks
# each crate on its own).
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lsdocs/lsdocs-protocol"

[workspace.dependencies]
# Internal crates. A version is given alongside the path so these are not
# wildcard dependencies once publishing is enabled.
lsdocs-doctree = { git = "https://github.com/lsdocs/lsdocs-doctree", branch = "main", version = "0.1.0" }
lsdocs-config = { path = "crates/config", version = "0.1.1" }
lsdocs-protocol = { path = "crates/protocol", version = "0.1.1" }

rmp-serde = "1.3.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
toml = "1.2.1"

[workspace.lints.rust]
# `deny` rather than `forbid` so the rpc crate can opt in locally with
# `#[allow(unsafe_code)]` for handle duplication (Phase 2).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library and binary code returns errors instead of panicking. Tests opt
# out with `#![allow(clippy::unwrap_used, ...)]` at the top of the module.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
