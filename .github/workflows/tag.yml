# A `<crate>/v<version>` tag (pushed by release.yml after a release PR is
# merged) gets its GitHub release, created with gh. An
# `lsdocs-protocol/v*` release has the JSON Schemas attached
# (schema.tar.gz), which lsdocs.github.io serves.
name: Tag

on:
  push:
    tags: ["*/v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lsdocs/.github/.github/create-release@main
      - name: Attach the JSON Schemas
        if: startsWith(github.ref_name, 'lsdocs-protocol/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf schema.tar.gz schema
          gh release upload "$TAG" schema.tar.gz
